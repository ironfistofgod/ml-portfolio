apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llama-serve
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "llama-serve-ip"
    networking.gke.io/managed-certificates: "llama-serve-cert"
spec:
  rules:
    - host: llama-serve.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llama-serve
                port:
                  number: 80