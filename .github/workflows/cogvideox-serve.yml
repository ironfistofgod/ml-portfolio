name: Build and Deploy CogVideoX Serve

on:
  push:
    branches: [main]
    paths:
      - 'video-diffusion/serve/**'
      - 'video-diffusion/helm/**'
  workflow_dispatch:
    inputs:
      deploy_gke:
        description: 'Deploy to GKE (requires cluster to be running)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./video-diffusion/serve
          push: true
          tags: |
            ghcr.io/ironfistofgod/cogvideox-serve:latest
            ghcr.io/ironfistofgod/cogvideox-serve:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_gke == true }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ml-portfolio
          location: us-central1-a

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          helm upgrade --install cogvideox-serve ./video-diffusion/helm \
            --set image.tag=${{ github.sha }}
