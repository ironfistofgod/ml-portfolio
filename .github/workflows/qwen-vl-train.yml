name: Build Qwen-VL Train Image

on:
  push:
    branches: [main]
    paths:
      - 'vlm/train/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/ironfistofgod/qwen-vl-train:latest \
            -t ghcr.io/ironfistofgod/qwen-vl-train:${{ github.sha }} \
            ./vlm/train

      - name: Push image
        run: |
          docker push ghcr.io/ironfistofgod/qwen-vl-train:latest
          docker push ghcr.io/ironfistofgod/qwen-vl-train:${{ github.sha }}
