name: Build F5-TTS Finetune Image

on:
  push:
    branches: [main]
    paths:
      - 'audio/tts/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./audio/tts
          file: ./audio/tts/finetune/Dockerfile
          push: true
          tags: |
            ghcr.io/ironfistofgod/f5tts-finetune:latest
            ghcr.io/ironfistofgod/f5tts-finetune:${{ github.sha }}
          no-cache: true
