name: Build and Deploy FLUX Serve

on:
  push:
    branches: [main]
    paths:
      - 'diffusion/serve/**'
      - 'diffusion/k8s/**'
      - 'diffusion/helm/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to GKE? (yes/no)'
        required: true
        default: 'no'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./diffusion/serve
          push: true
          tags: |
            ghcr.io/ironfistofgod/flux-serve:latest
            ghcr.io/ironfistofgod/flux-serve:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'yes'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ml-portfolio
          location: us-central1-a

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          helm upgrade --install flux-serve ./diffusion/helm \
            --set image.tag=${{ github.sha }}