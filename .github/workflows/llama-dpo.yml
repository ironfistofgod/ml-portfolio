name: Build LLaMA DPO Image

on:
  push:
    branches: [main]
    paths:
      - 'llama/dpo/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/ironfistofgod/llama-dpo:latest \
            -t ghcr.io/ironfistofgod/llama-dpo:${{ github.sha }} \
            ./llama/dpo

      - name: Push image
        run: |
          docker push ghcr.io/ironfistofgod/llama-dpo:latest
          docker push ghcr.io/ironfistofgod/llama-dpo:${{ github.sha }}