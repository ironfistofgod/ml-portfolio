name: Build MusicGen Finetune Image

on:
  push:
    branches: [main]
    paths:
      - 'audio/musicgen/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./audio/musicgen
          file: ./audio/musicgen/finetune/Dockerfile
          push: true
          tags: |
            ghcr.io/ironfistofgod/musicgen-finetune:latest
            ghcr.io/ironfistofgod/musicgen-finetune:${{ github.sha }}
          build-args: CACHEBUST=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
