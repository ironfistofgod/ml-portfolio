name: Build and Push Training Image

on:
  push:
    branches: [main]
    paths:
      - 'transformer/train/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -t ghcr.io/ironfistofgod/gpt-train:latest ./transformer/train
      - name: Push image
        run: docker push ghcr.io/ironfistofgod/gpt-train:latest