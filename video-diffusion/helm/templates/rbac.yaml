apiVersion: v1
kind: ServiceAccount
metadata:
  name: cogvideox-serve-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogvideox-serve-role
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogvideox-serve-rolebinding
subjects:
  - kind: ServiceAccount
    name: cogvideox-serve-sa
roleRef:
  kind: Role
  name: cogvideox-serve-role
  apiGroup: rbac.authorization.k8s.io
